<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PonteAnimada</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/",
        "@xterm/xterm": "/vendor/xterm/lib/xterm.mjs",
        "@xterm/addon-fit": "/vendor/xterm-fit/lib/addon-fit.mjs"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="22" height="22">
      <span>PonteAnimada</span>
    </div>
    <!-- Dentro de um projeto: voltar, o nome dele e o que ele é. -->
    <div class="crumb" id="crumb" hidden>
      <button class="btn small" id="back-home" title="Voltar à tela de projetos">← Projetos</button>
      <button class="project-name" id="project-name" title="Clique para mudar o nome do projeto"></button>
      <span class="project-facts" id="project-facts"></span>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <!-- Tela de entrada: cada personagem é um projeto. -->
  <section class="home" id="home">
    <div class="home-inner">
      <header class="home-title">
        <h1>Projetos</h1>
        <p class="hint">Cada personagem é um projeto separado. Abra um para ver o modelo, as animações dele e o terminal na pasta dele.</p>
      </header>
      <input type="file" id="file-input" accept=".fbx,.glb,.gltf,.blend,.obj,.zip,.png,.jpg,.jpeg,.tga,.bmp,.tif,.tiff,.webp,.exr,.dds,.mtl,.bin" multiple hidden>
      <div class="picker" id="home-projects"></div>
      <header class="home-head" id="meshy-head" hidden>
        <h2>Pedidos ao Meshy</h2>
      </header>
      <div class="meshy-grid" id="home-meshy"></div>
      <section class="activity" id="home-activity" aria-live="polite"></section>
    </div>
  </section>

  <!-- Tela do projeto: o visor à esquerda; as animações e o terminal à direita. -->
  <main class="project" id="project" hidden>
    <section class="stage">
      <div class="viewport" id="viewport">
        <div class="viewport-empty" id="viewport-empty"></div>
        <div class="viewport-title" id="viewport-title"></div>
        <div class="views" id="views" role="group" aria-label="Vista">
          <button type="button" data-view="front" title="Ver de frente">Frente</button>
          <button type="button" data-view="side" title="Ver de lado">Lado</button>
          <button type="button" data-view="back" title="Ver de trás">Trás</button>
          <button type="button" data-view="top" title="Ver de cima">Cima</button>
        </div>
      </div>
      <div class="transport" id="transport">
        <button class="icon-btn" id="play" aria-label="Reproduzir ou pausar" title="Espaço">▶</button>
        <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Posição na animação">
        <span class="time" id="time">—</span>
        <select id="speed" aria-label="Velocidade">
          <option value="0.25">0,25×</option>
          <option value="0.5">0,5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
        <label class="toggle" title="A câmera acompanha o personagem quando a animação o leva embora."><input type="checkbox" id="follow" checked> Seguir</label>
        <label class="toggle" title="Mostra a animação sem o deslocamento, só para ver."><input type="checkbox" id="in-place-view"> Parado</label>
        <label class="toggle"><input type="checkbox" id="bones"> Ossos</label>
        <label class="toggle"><input type="checkbox" id="wire"> Malha</label>
      </div>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Arraste para mudar a largura"></div>

    <aside class="side">
      <section class="panel anims">
        <header class="panel-head">
          <h2>Animações <span class="count" id="anim-count"></span></h2>
          <button class="btn small" id="mixamo-button" title="Escolha um ou mais FBX baixados do Mixamo: o Blender aplica cada um neste personagem, por trás.">+ Mixamo (.fbx)</button>
          <input type="file" id="mixamo-input" accept=".fbx" multiple hidden>
        </header>
        <div class="anim-list" id="anim-list"></div>
      </section>
      <section class="panel term">
        <header class="panel-head">
          <h2>Terminal <span class="count" id="term-where"></span></h2>
          <span class="term-state" id="term-state"></span>
          <button class="btn link small" id="term-restart" title="Fecha este terminal, com o que estiver rodando nele, e abre um novo na pasta do projeto.">reiniciar</button>
        </header>
        <div class="terminal" id="terminal"></div>
      </section>
    </aside>
  </main>

  <div class="dropzone" id="dropzone" hidden><div>Solte para enviar</div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
