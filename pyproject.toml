[project]
name = "ponte-animada"
version = "0.1.0"
description = "Ponte entre Blender, Kimodo e a validação humana de assets e animações 3D"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
ponte = "ponte.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ponte"]

[tool.ruff]
line-length = 120
